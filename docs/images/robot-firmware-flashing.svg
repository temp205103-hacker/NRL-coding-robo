<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Robot firmware upload steps</title>
  <desc id="desc">Six illustrated steps: install PlatformIO in VS Code, open the RobotFirmware folder containing platformio.ini, connect the robot safely with a data cable, build the robot environment, upload to the robot's serial port, and test with hardware diagnostics.</desc>
  <rect width="1100" height="850" rx="24" fill="#f3f6f8"/>
  <text x="550" y="48" fill="#172b3a" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">UPLOAD ROBOT FIRMWARE</text>
  <text x="550" y="78" fill="#526779" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">PlatformIO runs inside VS Code • Build and upload whenever your code is ready to test</text>

  <g font-family="Arial,sans-serif">
    <rect x="30" y="110" width="505" height="210" rx="18" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
    <circle cx="70" cy="150" r="23" fill="#176b87"/>
    <text x="70" y="157" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">1</text>
    <text x="108" y="156" fill="#172b3a" font-size="19" font-weight="700">Install PlatformIO</text>
    <rect x="58" y="182" width="160" height="98" rx="8" fill="#243746"/>
    <rect x="72" y="195" width="132" height="18" rx="3" fill="#314d60"/>
    <text x="138" y="208" fill="#eaf3f8" font-size="10" text-anchor="middle">VS CODE</text>
    <rect x="72" y="220" width="132" height="45" rx="4" fill="#176b50"/>
    <text x="138" y="239" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">PlatformIO IDE</text>
    <text x="138" y="255" fill="#d9f5e8" font-size="10" text-anchor="middle">extension installed</text>
    <text x="238" y="204" fill="#334e60" font-size="14">Install the PlatformIO IDE</text>
    <text x="238" y="226" fill="#334e60" font-size="14">extension in VS Code.</text>
    <text x="238" y="260" fill="#687f8e" font-size="12">Reload VS Code if prompted.</text>

    <rect x="565" y="110" width="505" height="210" rx="18" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
    <circle cx="605" cy="150" r="23" fill="#176b87"/>
    <text x="605" y="157" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">2</text>
    <text x="643" y="156" fill="#172b3a" font-size="19" font-weight="700">Open the project folder</text>
    <rect x="593" y="185" width="200" height="93" rx="6" fill="#243746"/>
    <path d="M593 207h200" stroke="#526d80" stroke-width="1"/>
    <text x="607" y="201" fill="#eaf3f8" font-size="10">EXPLORER</text>
    <text x="607" y="229" fill="#cfe2ee" font-size="12">RobotFirmware</text>
    <text x="621" y="250" fill="#a8d7bd" font-size="11">platformio.ini</text>
    <text x="621" y="268" fill="#b7c8d3" font-size="11">src  •  opmodes</text>
    <text x="813" y="204" fill="#334e60" font-size="14">File → Open Folder…</text>
    <text x="813" y="226" fill="#334e60" font-size="14">Select RobotFirmware,</text>
    <text x="813" y="248" fill="#334e60" font-size="14">the folder containing</text>
    <text x="813" y="270" fill="#176b50" font-size="14" font-weight="700">platformio.ini</text>

    <rect x="30" y="345" width="505" height="210" rx="18" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
    <circle cx="70" cy="385" r="23" fill="#176b87"/>
    <text x="70" y="392" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">3</text>
    <text x="108" y="391" fill="#172b3a" font-size="19" font-weight="700">Connect safely</text>
    <rect x="70" y="423" width="118" height="77" rx="14" fill="#1e6b50"/>
    <text x="129" y="451" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ESP32-S3</text>
    <text x="129" y="472" fill="#eafff3" font-size="11" text-anchor="middle">robot board</text>
    <path d="M188 462h64" stroke="#176b87" stroke-width="5"/>
    <path d="M246 452l15 10-15 10" fill="none" stroke="#176b87" stroke-width="4"/>
    <rect x="263" y="432" width="65" height="58" rx="7" fill="#2c3e50"/>
    <rect x="278" y="442" width="35" height="21" rx="3" fill="#bde7f5"/>
    <text x="295" y="479" fill="#fff" font-size="10" text-anchor="middle">USB data</text>
    <text x="350" y="430" fill="#334e60" font-size="13">Use a USB data cable.</text>
    <text x="350" y="452" fill="#334e60" font-size="13">Lift wheels or disconnect</text>
    <text x="350" y="474" fill="#334e60" font-size="13">drive motors for first tests.</text>
    <text x="350" y="510" fill="#9a5c14" font-size="12" font-weight="700">Keep the robot safe and still.</text>

    <rect x="565" y="345" width="505" height="210" rx="18" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
    <circle cx="605" cy="385" r="23" fill="#176b87"/>
    <text x="605" y="392" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">4</text>
    <text x="643" y="391" fill="#172b3a" font-size="19" font-weight="700">Build first</text>
    <rect x="593" y="420" width="446" height="104" rx="8" fill="#243746"/>
    <text x="612" y="445" fill="#b7c8d3" font-size="12">PLATFORMIO  /  PROJECT TASKS</text>
    <text x="612" y="475" fill="#eaf3f8" font-size="14">robot  →  General  →  <tspan fill="#a8e0bf" font-weight="700">Build</tspan></text>
    <text x="612" y="502" fill="#b7c8d3" font-size="12">First build downloads required packages. Wait for success.</text>
    <text x="593" y="542" fill="#9a5c14" font-size="12" font-weight="700">Fix build errors before uploading.</text>

    <rect x="30" y="580" width="505" height="210" rx="18" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
    <circle cx="70" cy="620" r="23" fill="#176b87"/>
    <text x="70" y="627" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">5</text>
    <text x="108" y="626" fill="#172b3a" font-size="19" font-weight="700">Upload to the robot</text>
    <rect x="58" y="656" width="210" height="93" rx="8" fill="#243746"/>
    <text x="76" y="682" fill="#b7c8d3" font-size="12">PLATFORMIO</text>
    <rect x="76" y="694" width="174" height="35" rx="6" fill="#176b50"/>
    <text x="163" y="717" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">→  Upload</text>
    <text x="288" y="674" fill="#334e60" font-size="14">Choose Upload or press</text>
    <text x="288" y="698" fill="#176b50" font-size="14" font-weight="700">Ctrl+Alt+U</text>
    <text x="288" y="724" fill="#334e60" font-size="13">Select the robot's COM port</text>
    <text x="288" y="746" fill="#334e60" font-size="13">if prompted. Wait for success.</text>

    <rect x="565" y="580" width="505" height="210" rx="18" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
    <circle cx="605" cy="620" r="23" fill="#176b87"/>
    <text x="605" y="627" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">6</text>
    <text x="643" y="626" fill="#172b3a" font-size="19" font-weight="700">Restart and test</text>
    <circle cx="655" cy="698" r="37" fill="#e5edf3" stroke="#587187" stroke-width="3"/>
    <path d="M655 674v25l18 11" fill="none" stroke="#176b50" stroke-width="5" stroke-linecap="round"/>
    <text x="720" y="677" fill="#334e60" font-size="14">Restart the robot. Run</text>
    <text x="720" y="701" fill="#176b50" font-size="14" font-weight="700">HW Diagnostics</text>
    <text x="720" y="725" fill="#334e60" font-size="14">before driving or testing</text>
    <text x="720" y="749" fill="#334e60" font-size="14">autonomous routines.</text>
  </g>
  <text x="550" y="824" fill="#526779" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Ordinary code updates do not need an erase. Erasing flash deletes saved routes and settings.</text>
</svg>
